    cancelBtn.style.display = "block";
    document.getElementById('tab-products').scrollIntoView();
  },'editProduct')
  window.cancelEdit = () => {
    editingId = null;
    [pName,pImg,pPrice,pOldPrice,pStock,pDesc].forEach(i=>i.value='');
    formTitle.innerText = "➕ Add Service";
    saveBtn.innerText = "Save Service";
    saveBtn.style.background = "var(--accent)";
    cancelBtn.style.display = "none";
  }
  window.saveProduct = safe(() => {
    if(currentUser.role == 'reception') return alert('No permission');
    let productData = {
      name: pName.value.trim(),
      category: pCat.value,
      img: pImg.value.trim() || 'https://i.ibb.co/5gyYzRC3/Screenshot-20260803-181928-com-whatsapp-w4b-edit-97786639672642.jpg',
      price: Number(pPrice.value) || 0,
      oldPrice: Number(pOldPrice.value) || 0,
      stock: Number(pStock.value) || 0,
      desc: pDesc.value.trim()
    };
    if(!productData.name){ return alert('Please enter service name') }
    if(editingId){
      set(ref(db, 'kpsbiz/categories/' + editingId), productData).then(()=>{
        alert('Service Updated!');
        cancelEdit();
      }).catch(err=> alert('Error: ' + err.message));
    } else {
      let id = Date.now().toString();
      set(ref(db, 'kpsbiz/categories/' + id), productData).then(()=>{
        [pName,pImg,pPrice,pOldPrice,pStock,pDesc].forEach(i=>i.value='');
        alert('Service Added!');
      }).catch(err=> alert('Error: ' + err.message));
    }
  },'saveProduct')

  function buildStockList(){
    stockList.innerHTML = '';
    Object.entries(products||{}).forEach(([id,p])=>{
      stockList.innerHTML += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border:1px solid var(--border);border-radius:8px;margin:5px 0"><div><b>${p.name}</b><br><small class="${+p.stock<10?'stock-low':''}">Capacity: ${+p.stock||0}</small></div><div><input type="number" id="stock_${id}" value="0" style="width:80px"><button class="btn-green" onclick="updateStock('${id}')">+ Add</button></div></div>`;
    })
  }

  window.seedDatabase = safe(() => {
    if(currentUser.role!= 'ceo' && currentUser.role!= 'manager') return alert('No permission');
    const defaultData = [
      {name:"University Application - 1 Institution", category:"University", price:80, stock:999, img:"https://i.ibb.co/5gyYzRC3/Screenshot-20260803-181928-com-whatsapp-w4b-edit-97786639672642.jpg", desc:"1 University"},
      {name:"University Application - Combo 4", category:"University", price:240, stock:999, img:"https://i.ibb.co/5gyYzRC3/Screenshot-20260803-181928-com-whatsapp-w4b-edit-97786639672642.jpg", desc:"4 Universities"},
      {name:"TVET College Application - 1 College", category:"TVET College", price:50, stock:999, img:"https://i.ibb.co/5gyYzRC3/Screenshot-20260803-181928-com-whatsapp-w4b-edit-97786639672642.jpg", desc:"1 TVET College"},
      {name:"NSFAS Application Assistance", category:"NSFAS & Bursaries", price:100, stock:999, img:"https://i.ibb.co/5gyYzRC3/Screenshot-20260803-181928-com-whatsapp-w4b-edit-97786639672642.jpg", desc:"Full NSFAS Support"},
      {name:"Computer Training - Block 1", category:"Computer Training", price:450, stock:50, img:"https://i.ibb.co/5gyYzRC3/Screenshot-20260803-181928-com-whatsapp-w4b-edit-97786639672642.jpg", desc:"Computer Fundamentals"},
      {name:"Printing - A4 Black & White", category:"Internet Cafe", price:3, stock:9999, img:"https://i.ibb.co/5gyYzRC3/Screenshot-20260803-181928-com-whatsapp-w4b-edit-97786639672642.jpg", desc:"Per Page"},
      {name:"Popcorn - Small", category:"Food & Snacks", price:15, stock:200, img:"https://i.ibb.co/5gyYzRC3/Screenshot-20260803-181928-com-whatsapp-w4b-edit-97786639672642.jpg", desc:"Small Tub"}
    ];
    defaultData.forEach(p=>{ let id = Date.now().toString() + Math.random(); set(ref(db, 'kpsbiz/categories/' + id), p); });
    alert('All Default services added to Firebase!')
  },'seedDatabase')

  window.deleteProduct = safe((id) => { if(currentUser.role!= 'ceo') return alert('CEO only'); if(confirm('Delete this service?')) remove(ref(db, 'kpsbiz/categories/' + id)).catch(e=>alert(e.message)) },'deleteProduct')
  window.updateStock = safe((id) => { let add = parseInt(document.getElementById('stock_'+id).value)||0; set(ref(db, 'kpsbiz/categories/' + id + '/stock'), (+products[id].stock||0) + add).catch(e=>alert(e.message)); document.getElementById('stock_'+id).value = 0; },'updateStock')

  window.addToCart = safe((id) => {
    let p = products[id];
    if(!p) return alert('Service not found');
    let item = cart.find(x=>x.id==id);
    if(item){
        item.qty++
    } else {
        cart.push({id,name:p.name,price:+p.price||0,qty:1,category:p.category})
    }
    updateCart();
    renderProducts();
    renderClientProducts();
},'addToCart')

  window.decreaseQty = safe((id) => {
    let item = cart.find(x=>x.id==id);
    if(item){
      item.qty--;
      if(item.qty <= 0){
        cart = cart.filter(x=>x.id!=id);
      }
    }
    updateCart();
    renderProducts();
    renderClientProducts();
  },'decreaseQty')

  function updateCart(){
    cartBar.style.display = cart.length?'block':'none';
    clientCartBar.style.display = cart.length?'block':'none';
    let count = cart.reduce((a,b)=>a+(b.qty||0),0);
    let total = cart.reduce((a,b)=>a+(b.qty||0)*(+b.price||0),0);
    if(cartCount) cartCount.innerText = count;
    if(clientCartCount) clientCartCount.innerText = count;
    if(cartTotal) cartTotal.innerText = total;
    if(clientCartTotal) clientCartTotal.innerText = total;
  }

  window.openCustomerModal = () => { if(cart.length === 0) return alert('Cart empty'); document.getElementById('customerModal').style.display = 'flex'; }

  window.sendQuote = safe(() => {
    let name = document.getElementById('custName').value.trim();
    let phone = document.getElementById('custPhone').value.trim();
    let email = document.getElementById('custEmail').value.trim();
    if(!name ||!phone) return alert('Please enter Name and Phone');
    const orderId = Date.now().toString();
    const order = {
      user: isClientMode? name : currentUser.email,
      customerName: name,
      customerPhone: phone,
      customerEmail: email,
      items: cart,
      total: cart.reduce((a,b)=>a+(b.qty||0)*(+b.price||0),0),
      date: new Date().toISOString(),
      status: 'Pending'
    };
    set(ref(db, 'kpsbiz/requests/' + orderId), order).then(()=>{
      let msg = `🎓 KPS APPLICATION REQUEST\nName: ${name}\nPhone: ${phone}\nEmail: ${email}\n` + cart.map(i=>`${i.name} x${i.qty} - R${i.price}`).join('\n') + `\nTotal: R${order.total}\n\nReg No: 2025/594397/07`;
      window.open(`https://wa.me/27767021104?text=${encodeURIComponent(msg)}`);
      cart = []; updateCart(); renderProducts(); renderClientProducts();
      document.getElementById('customerModal').style.display='none';
      document.getElementById('custName').value='';
      document.getElementById('custPhone').value='';
      document.getElementById('custEmail').value='';
      alert('Request sent! We will contact you shortly.')
    }).catch(e=>alert('Send failed: '+e.message))
  },'sendQuote')

  window.downloadReport = safe(() => {
    const doc = new jsPDF();
    doc.text("KPS Report", 10, 10);
    doc.text(`Total Services: ${Object.keys(products||{}).length}`, 10, 20);
    doc.text(`Active Applications: ${Object.values(products||{}).reduce((a,b)=>a+(+b.stock||0),0)}`, 10, 30);
    doc.text(`Pending Requests: ${Object.values(orders||{}).filter(o=>o.status=='Pending').length}`, 10, 40);
    doc.text(`Generated: ${new Date().toLocaleString()}`, 10, 50);
    doc.save("KPS-Report.pdf");
  },'downloadReport')

  window.downloadCSV = safe(() => {
    if(!orders || Object.keys(orders).length === 0) return alert('No requests to export');
    let csv = 'Request ID,Date,Student Name,Phone,Email,Services,Total R,Status\n';
    Object.entries(orders).forEach(([id,o])=>{
      let items = (o.items||[]).map(i=>`${i.name} x${i.qty}`).join('; ');
      let date = new Date(o.date).toLocaleDateString();
      csv += `"${id.slice(-6)}","${date}","${o.customerName||'Guest'}","${o.customerPhone||''}","${o.customerEmail||''}","${items}",${+o.total||0},"${o.status}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `KPS-Requests-${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
  },'downloadCSV')

  function setClientLink(){
    let link = window.location.origin + window.location.pathname + '?client=1';
    if(document.getElementById('clientShareLink')) document.getElementById('clientShareLink').value = link;
  }
  window.copyClientLink = () => {
    let link = document.getElementById('clientShareLink');
    link.select();
    document.execCommand('copy');
    alert('Client link copied! 📋');
  }
  window.shareClientWhatsApp = () => {
    let link = document.getElementById('clientShareLink').value;
    let msg = `🎓 KGOPOTSO PROJECTS & SUPPLIES 🎓\n\nApply to University, TVET & NSFAS online:\n${link}\n\nGET ACCEPTED WITH US!!!`;
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
  }
  window.toggleDark = () => {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
  }
  if(localStorage.getItem('darkMode')==='true') document.body.classList.add('dark-mode');
});

// FORCE CLEAR CACHE ONCE
if('caches' in window){ caches.keys().then(names => names.forEach(name => caches.delete(name))); }
if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())); }
localStorage.clear(); sessionStorage.clear(); console.log("Cache cleared");
</script>
</body>
</html>
